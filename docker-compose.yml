services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgxotel
      POSTGRES_PASSWORD: pgxotel
      POSTGRES_DB: pgxotel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgxotel -d pgxotel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
